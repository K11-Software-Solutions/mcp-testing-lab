name: CI quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: Protocol, server, check, host and gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --junitxml=reports/junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  mcp-gate:
    name: MCP gate + bad servers and weakened hosts that must fail
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Server checks against pinned manifests, and host red-team checks
        run: python -m evals.run_mcp_checks
      - name: Publish report to the job summary
        if: always()
        run: cat evals/results/mcp_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Negative controls (each MUST fail)
        run: |
          for v in sloppy drifting leaky poisoned rugpull shadowing collider no-namespacing no-pinning no-scanning no-arg-policy; do
            if MCP_VARIANT=$v python -m evals.run_mcp_checks --out /tmp/neg > /dev/null 2>&1; then
              echo "::error::The MCP gate passed '$v'. The gate is broken."
              exit 1
            fi
            echo "Gate correctly rejected: $v"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-report
          path: evals/results/

  experiments:
    name: Experiments are reproducible
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-run all four experiments
        run: python -m experiments.run_experiments > /dev/null
      - name: Results must match the committed ones
        run: |
          if ! git diff --exit-code -- experiments/results/; then
            echo "::error::Experiment results differ from the committed ones. Re-run and commit them, and update any article that quotes them."
            exit 1
          fi
          echo "Experiment results reproduced exactly."
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: experiments/results/
